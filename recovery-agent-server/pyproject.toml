[project]
name = "recovery-agent-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nishchal05", email = "nishchalsundan04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.5",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "pgvector>=0.5.0",
    "prisma>=0.15.0",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "twilio>=9.11.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
recovery-agent-server = "recovery_agent_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
